<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5fa8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vereinsorga">
  <title>Vereinsorga</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Farbschema sofort setzen, damit beim Start nichts aufblitzt ('light' | 'dark' | sonst automatisch)
    try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Zurück" hidden>&#8592;</button>
    <h1 id="title">Vereinsorga</h1>
    <span id="offlineBadge" class="badge" hidden>offline</span>
    <button id="userBtn" class="user-btn" hidden></button>
  </header>
  <main id="view"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="db.js"></script>
  <script src="import.js"></script>
  <script src="firebase.js"></script>
  <script src="auth.js"></script>
  <script src="sync.js"></script>
  <script src="calendar.js"></script>
  <script src="bayairn.js"></script>
  <script src="cocktails.js"></script>
  <script src="app.js"></script>
</body>
</html>
